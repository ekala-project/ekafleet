[package]
name = "ekafleet"
version = "0.1.0"
edition = "2024"
description = "Unified fleet management for ekaos"
license = "MPL-2.0"

[lib]
name = "ekafleet"
path = "src/lib.rs"

[[bin]]
name = "ekafleet"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# gRPC (with TLS via rustls + ring)
tonic = { version = "0.13", features = ["tls-ring"] }
prost = "0.13"
prost-types = "0.13"

# Streaming
tokio-stream = "0.1"

# HTTP API
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time (required by rcgen for certificate validity)
time = "0.3"

# Cryptography & TLS
ring = "0.17"
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.17"
rustls-pemfile = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.13"
