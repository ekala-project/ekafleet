[package]
name = "ekafleet"
version = "0.1.0"
edition = "2024"
description = "Unified fleet management for ekaos"
license = "MPL-2.0"

[[bin]]
name = "ekafleet"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# gRPC
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"

# Streaming
tokio-stream = "0.1"

# HTTP API
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tonic-build = "0.13"
