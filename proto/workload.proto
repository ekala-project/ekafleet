syntax = "proto3";

// SPIFFE Workload API, wire-compatible with the upstream definition
// (github.com/spiffe/go-spiffe/v2/proto/spiffe/workload/workload.proto).
//
// Deliberately declares no package: the upstream service is addressed as
// `/SpiffeWorkloadAPI/<Method>`, and standard clients (go-spiffe,
// rust-spiffe, java-spiffe, Envoy via SPIRE) depend on that exact path and on
// these field numbers.
//
// Served by the agent at unix:///run/ekafleet/workload-api.sock. Callers must
// send the `workload.spiffe.io: true` metadata header and are identified by
// their Unix socket peer credentials (PID → systemd cgroup → service).

import "google/protobuf/struct.proto";

service SpiffeWorkloadAPI {
  // X.509-SVIDs for the calling workload. Streams a new response whenever an
  // SVID is renewed or the trust bundle changes.
  rpc FetchX509SVID(X509SVIDRequest) returns (stream X509SVIDResponse);

  // X.509 trust bundles, keyed by trust domain SPIFFE ID.
  rpc FetchX509Bundles(X509BundlesRequest) returns (stream X509BundlesResponse);

  // A JWT-SVID for the calling workload, for the requested audience.
  rpc FetchJWTSVID(JWTSVIDRequest) returns (JWTSVIDResponse);

  // JWT bundles (JWKS documents), keyed by trust domain SPIFFE ID.
  rpc FetchJWTBundles(JWTBundlesRequest) returns (stream JWTBundlesResponse);

  // Validate a JWT-SVID against the trust domain's JWT bundle.
  rpc ValidateJWTSVID(ValidateJWTSVIDRequest) returns (ValidateJWTSVIDResponse);
}

message X509SVIDRequest {}

message X509SVIDResponse {
  repeated X509SVID svids = 1;
  // ASN.1 DER encoded certificate revocation lists.
  repeated bytes crl = 2;
  // DER CA bundles of federated trust domains, keyed by trust domain ID.
  map<string, bytes> federated_bundles = 3;
}

message X509SVID {
  // e.g. spiffe://fleet.internal/service/web
  string spiffe_id = 1;
  // ASN.1 DER certificates, concatenated: the leaf first, then intermediates.
  bytes x509_svid = 2;
  // ASN.1 DER PKCS#8 private key for the leaf.
  bytes x509_svid_key = 3;
  // ASN.1 DER CA certificates of the SVID's trust domain, concatenated.
  bytes bundle = 4;
  // Operator-defined hint to disambiguate multiple SVIDs.
  string hint = 5;
}

message X509BundlesRequest {}

message X509BundlesResponse {
  repeated bytes crl = 1;
  // ASN.1 DER CA certificates, concatenated, keyed by trust domain ID.
  map<string, bytes> bundles = 2;
}

message JWTSVIDRequest {
  // Required. At least one audience.
  repeated string audience = 1;
  // Optional. When set, must be the calling workload's own SPIFFE ID.
  string spiffe_id = 2;
}

message JWTSVIDResponse {
  repeated JWTSVID svids = 1;
}

message JWTSVID {
  string spiffe_id = 1;
  // Compact-serialized JWS.
  string svid = 2;
  string hint = 3;
}

message JWTBundlesRequest {}

message JWTBundlesResponse {
  // JWKS documents (RFC 7517), keyed by trust domain ID.
  map<string, bytes> bundles = 1;
}

message ValidateJWTSVIDRequest {
  // Required. The audience the token must have been issued for.
  string audience = 1;
  // Required. The compact-serialized JWT-SVID.
  string svid = 2;
}

message ValidateJWTSVIDResponse {
  string spiffe_id = 1;
  google.protobuf.Struct claims = 2;
}
