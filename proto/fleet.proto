syntax = "proto3";

package fleet;

// Bidirectional streaming control channel between server and agents.
service FleetControl {
  // Long-lived bidirectional stream for agent ↔ server communication.
  rpc StreamControl(stream AgentMessage) returns (stream ServerMessage);

  // Request a deployment plan (dry-run).
  rpc Plan(PlanRequest) returns (PlanResponse);

  // Execute a deployment plan.
  rpc Apply(ApplyRequest) returns (stream ApplyEvent);

  // Query fleet status.
  rpc Status(StatusRequest) returns (FleetStatus);
}

// --- Agent → Server messages ---

message AgentMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    HealthReport health = 2;
    StatusReport status = 3;
    CertificateRequest cert_request = 4;
    MetricsSummary metrics = 5;
    Nack nack = 6;
  }
}

message Heartbeat {
  string node_id = 1;
  uint64 timestamp = 2;
  NodeResources available_resources = 3;
}

message NodeResources {
  uint64 cpu_millicores = 1;
  uint64 memory_mb = 2;
  uint64 disk_mb = 3;
}

message HealthReport {
  string node_id = 1;
  repeated ServiceHealth services = 2;
}

message ServiceHealth {
  string service_name = 1;
  string instance_id = 2;
  HealthStatus status = 3;
  string message = 4;
  uint64 checked_at = 5;
}

enum HealthStatus {
  HEALTH_UNKNOWN = 0;
  HEALTHY = 1;
  UNHEALTHY = 2;
  DEGRADED = 3;
}

message StatusReport {
  string node_id = 1;
  repeated ServiceInstance running_services = 2;
  string current_system_path = 3;
}

message ServiceInstance {
  string service_name = 1;
  string instance_id = 2;
  string store_path = 3;
  ServiceState state = 4;
}

enum ServiceState {
  SERVICE_STATE_UNKNOWN = 0;
  SERVICE_RUNNING = 1;
  SERVICE_STOPPED = 2;
  SERVICE_FAILED = 3;
  SERVICE_STARTING = 4;
}

message CertificateRequest {
  string node_id = 1;
  string service_name = 2;
  bytes csr = 3;
}

message MetricsSummary {
  string node_id = 1;
  repeated MetricPoint points = 2;
}

message MetricPoint {
  string name = 1;
  double value = 2;
  map<string, string> labels = 3;
  uint64 timestamp = 4;
}

message Nack {
  string correlation_id = 1;
  string reason = 2;
}

// --- Server → Agent messages ---

message ServerMessage {
  oneof payload {
    DesiredState desired_state = 1;
    DeployCommand deploy = 2;
    SecretUpdate secret = 3;
    DnsUpdate dns = 4;
    CertificateResponse cert = 5;
    PeerUpdate peers = 6;
    PolicyUpdate policy = 7;
    TrustBundleUpdate trust_bundle = 8;
  }
}

// CA trust bundle pushed to agents for SPIFFE workload verification.
message TrustBundleUpdate {
  string trust_domain = 1;
  bytes ca_certificate_pem = 2;
}

message DesiredState {
  string correlation_id = 1;
  repeated ServiceSpec services = 2;
  string system_path = 3;
}

message ServiceSpec {
  string name = 1;
  string store_path = 2;
  string command = 3;
  map<string, string> environment = 4;
  ResourceRequirements resources = 5;
  HealthCheckSpec health_check = 6;
  repeated PortSpec ports = 7;
}

message ResourceRequirements {
  uint64 cpu_request = 1;
  uint64 memory_request = 2;
  uint64 cpu_limit = 3;
  uint64 memory_limit = 4;
}

message HealthCheckSpec {
  oneof probe {
    HttpProbe http = 1;
    TcpProbe tcp = 2;
    ExecProbe exec = 3;
  }
  uint32 interval_seconds = 4;
  uint32 timeout_seconds = 5;
  uint32 healthy_threshold = 6;
  uint32 unhealthy_threshold = 7;
}

message HttpProbe {
  string path = 1;
  uint32 port = 2;
}

message TcpProbe {
  uint32 port = 1;
}

message ExecProbe {
  repeated string command = 1;
}

message PortSpec {
  string name = 1;
  uint32 port = 2;
  string protocol = 3;
  string hostname = 4;
}

message DeployCommand {
  string deployment_id = 1;
  string service_name = 2;
  string store_path = 3;
  DeployStrategy strategy = 4;
}

enum DeployStrategy {
  ROLLING = 0;
  CANARY = 1;
  BLUE_GREEN = 2;
}

message SecretUpdate {
  string service_name = 1;
  string secret_name = 2;
  bytes encrypted_value = 3;
  uint64 version = 4;
}

message DnsUpdate {
  repeated DnsRecord records = 1;
}

message DnsRecord {
  string name = 1;
  DnsRecordType record_type = 2;
  repeated string values = 3;
  uint32 ttl = 4;
}

enum DnsRecordType {
  A = 0;
  AAAA = 1;
  SRV = 2;
  CNAME = 3;
}

message CertificateResponse {
  bytes certificate = 1;
  bytes chain = 2;
  uint64 expires_at = 3;
}

message PeerUpdate {
  repeated WireguardPeer peers = 1;
}

message WireguardPeer {
  string node_id = 1;
  string public_key = 2;
  string endpoint = 3;
  string allowed_ip = 4;
}

message PolicyUpdate {
  repeated NetworkPolicy policies = 1;
}

message NetworkPolicy {
  string source_service = 1;
  string target_service = 2;
  repeated uint32 allowed_ports = 3;
}

// --- Plan / Apply / Status RPCs ---

message PlanRequest {
  string config_path = 1;
}

message PlanResponse {
  repeated PlannedOperation operations = 1;
  bool has_changes = 2;
}

message PlannedOperation {
  OperationType operation_type = 1;
  string service_name = 2;
  string target_node = 3;
  string description = 4;
}

enum OperationType {
  CREATE = 0;
  UPDATE = 1;
  DESTROY = 2;
  RESCHEDULE = 3;
}

message ApplyRequest {
  string config_path = 1;
  bool auto_approve = 2;
}

message ApplyEvent {
  string operation_id = 1;
  ApplyStatus status = 2;
  string message = 3;
}

enum ApplyStatus {
  APPLY_PENDING = 0;
  APPLY_IN_PROGRESS = 1;
  APPLY_SUCCEEDED = 2;
  APPLY_FAILED = 3;
  APPLY_ROLLED_BACK = 4;
}

message StatusRequest {
  // Empty for now; can add filters later.
}

message FleetStatus {
  string fleet_name = 1;
  repeated NodeStatus nodes = 2;
  repeated ServiceStatus services = 3;
}

message NodeStatus {
  string node_id = 1;
  string address = 2;
  bool healthy = 3;
  NodeResources total_resources = 4;
  NodeResources available_resources = 5;
  uint64 last_heartbeat = 6;
}

message ServiceStatus {
  string name = 1;
  uint32 desired_count = 2;
  uint32 healthy_count = 3;
  repeated InstanceStatus instances = 4;
}

message InstanceStatus {
  string instance_id = 1;
  string node_id = 2;
  ServiceState state = 3;
  HealthStatus health = 4;
}
