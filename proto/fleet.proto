syntax = "proto3";

package fleet;

// Bidirectional streaming control channel between server and agents.
service FleetControl {
  // Long-lived bidirectional stream for agent ↔ server communication.
  rpc StreamControl(stream AgentMessage) returns (stream ServerMessage);

  // Request a deployment plan (dry-run).
  rpc Plan(PlanRequest) returns (PlanResponse);

  // Execute a deployment plan.
  rpc Apply(ApplyRequest) returns (stream ApplyEvent);

  // Query fleet status.
  rpc Status(StatusRequest) returns (FleetStatus);

  // Node attestation — unauthenticated, bypasses bearer token interceptor.
  // Used by new agents to bootstrap identity via SPIFFE-style attestation.
  rpc Attest(NodeAttestationRequest) returns (NodeAttestationResult);

  // Rollback a machine (or all machines) to a previous deployment generation.
  rpc Rollback(RollbackRequest) returns (RollbackResponse);

  // Drain a node — mark unschedulable and reschedule its services elsewhere.
  rpc Drain(DrainRequest) returns (DrainResponse);

  // Scale a service to a desired replica count.
  rpc Scale(ScaleRequest) returns (ScaleResponse);

  // Take a Raft state snapshot for disaster recovery.
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);

  // Restore Raft state from a snapshot.
  rpc Restore(RestoreRequest) returns (RestoreResponse);

  // Dispatch a parameterized batch job with arguments.
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);

  // Execute a command in a running service's context.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // Stream logs from a service.
  rpc Logs(LogsRequest) returns (stream LogsChunk);

  // Query fleet events with filtering.
  rpc Events(EventsRequest) returns (EventsResponse);

  // List all connected nodes with details.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // Get detailed information about a specific node.
  rpc GetNode(GetNodeRequest) returns (NodeDetail);

  // Update node properties (e.g., cordon/uncordon).
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);

  // Query real-time resource usage for nodes and services.
  rpc Top(TopRequest) returns (TopResponse);

  // List deployment history.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);

  // Promote a canary deployment.
  rpc PromoteDeployment(PromoteRequest) returns (PromoteResponse);

  // Fail a stuck deployment (triggers rollback).
  rpc FailDeployment(FailDeploymentRequest) returns (FailDeploymentResponse);

  // Create an ACL token.
  rpc CreateACLToken(CreateACLTokenRequest) returns (CreateACLTokenResponse);

  // Revoke an ACL token.
  rpc RevokeACLToken(RevokeACLTokenRequest) returns (RevokeACLTokenResponse);

  // List ACL tokens.
  rpc ListACLTokens(ListACLTokensRequest) returns (ListACLTokensResponse);
}

// --- Agent → Server messages ---

message AgentMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    HealthReport health = 2;
    StatusReport status = 3;
    CertificateRequest cert_request = 4;
    MetricsSummary metrics = 5;
    Nack nack = 6;
    NodeAttestationResponse attest_response = 7;
  }
}

message Heartbeat {
  string node_id = 1;
  uint64 timestamp = 2;
  NodeResources available_resources = 3;
  string pool = 4;
  string version = 5;
}

message NodeResources {
  uint64 cpu_millicores = 1;
  uint64 memory_mb = 2;
  uint64 disk_mb = 3;
}

message HealthReport {
  string node_id = 1;
  repeated ServiceHealth services = 2;
}

message ServiceHealth {
  string service_name = 1;
  string instance_id = 2;
  HealthStatus status = 3;       // liveness status (should we restart?)
  string message = 4;
  uint64 checked_at = 5;
  HealthStatus readiness = 6;    // readiness status (should we route traffic?)
}

enum HealthStatus {
  HEALTH_UNKNOWN = 0;
  HEALTHY = 1;
  UNHEALTHY = 2;
  DEGRADED = 3;
}

message StatusReport {
  string node_id = 1;
  repeated ServiceInstance running_services = 2;
  string current_system_path = 3;
}

message ServiceInstance {
  string service_name = 1;
  string instance_id = 2;
  string store_path = 3;
  ServiceState state = 4;
}

enum ServiceState {
  SERVICE_STATE_UNKNOWN = 0;
  SERVICE_RUNNING = 1;
  SERVICE_STOPPED = 2;
  SERVICE_FAILED = 3;
  SERVICE_STARTING = 4;
}

message CertificateRequest {
  string node_id = 1;
  string service_name = 2;
  bytes csr = 3;
  CertRequestType request_type = 4;
}

enum CertRequestType {
  SERVICE_CERT = 0;  // Default: request an X.509-SVID for a service workload.
  NODE_CERT = 1;     // Request a node SVID (spiffe://<domain>/agent/<node-id>).
}

message MetricsSummary {
  string node_id = 1;
  repeated MetricPoint points = 2;
}

message MetricPoint {
  string name = 1;
  double value = 2;
  map<string, string> labels = 3;
  uint64 timestamp = 4;
}

message Nack {
  string correlation_id = 1;
  string reason = 2;
}

// --- Server → Agent messages ---

message ServerMessage {
  oneof payload {
    DesiredState desired_state = 1;
    DeployCommand deploy = 2;
    SecretUpdate secret = 3;
    DnsUpdate dns = 4;
    CertificateResponse cert = 5;
    PeerUpdate peers = 6;
    PolicyUpdate policy = 7;
    TrustBundleUpdate trust_bundle = 8;
    NodeAttestationChallenge attest_challenge = 9;
    FleetKeyUpdate fleet_key = 10;
  }
}

// CA trust bundle pushed to agents for SPIFFE workload verification.
message TrustBundleUpdate {
  string trust_domain = 1;
  bytes ca_certificate_pem = 2;
}

message DesiredState {
  string correlation_id = 1;
  repeated ServiceSpec services = 2;
  string system_path = 3;
}

message ServiceSpec {
  string name = 1;
  string store_path = 2;
  string command = 3;
  map<string, string> environment = 4;
  ResourceRequirements resources = 5;
  HealthCheckSpec health_check = 6;
  repeated PortSpec ports = 7;

  // Separate liveness/readiness/startup probes (K8s-style).
  // If set, these take precedence over the unified health_check field.
  // - liveness: should the service be restarted? Failures trigger restart.
  // - readiness: should we route traffic? Failures remove from load balancing.
  // - startup: is the service still initializing? Suppresses liveness until passing.
  HealthCheckSpec liveness_probe = 8;
  HealthCheckSpec readiness_probe = 9;
  HealthCheckSpec startup_probe = 10;

  // Lifecycle hooks and shutdown configuration.
  LifecycleHooks lifecycle = 11;

  // Persistent volumes attached to this service.
  repeated VolumeMount volumes = 12;
}

message VolumeMount {
  string name = 1;
  string mount_path = 2;
  uint64 size_mb = 3;
  string storage_class = 4;
  string access_mode = 5;
  bool reclaim_retain = 6;
}

message LifecycleHooks {
  // Command to run before stopping the service (pre-stop hook).
  repeated string pre_stop = 1;
  // Command to run after the service starts (post-start hook).
  repeated string post_start = 2;
  // Signal to send for graceful shutdown (e.g., "SIGTERM", "SIGQUIT").
  string stop_signal = 3;
  // Seconds to wait after stop signal before force-killing.
  uint32 termination_grace_period_seconds = 4;
}

message ResourceRequirements {
  uint64 cpu_request = 1;
  uint64 memory_request = 2;
  uint64 cpu_limit = 3;
  uint64 memory_limit = 4;
}

message HealthCheckSpec {
  oneof probe {
    HttpProbe http = 1;
    TcpProbe tcp = 2;
    ExecProbe exec = 3;
    GrpcProbe grpc = 8;
  }
  uint32 interval_seconds = 4;
  uint32 timeout_seconds = 5;
  uint32 healthy_threshold = 6;
  uint32 unhealthy_threshold = 7;
}

message HttpProbe {
  string path = 1;
  uint32 port = 2;
}

message TcpProbe {
  uint32 port = 1;
}

message ExecProbe {
  repeated string command = 1;
}

message GrpcProbe {
  uint32 port = 1;
  string service = 2;  // gRPC service name for health check (optional)
}

message PortSpec {
  string name = 1;
  uint32 port = 2;
  string protocol = 3;
  string hostname = 4;
}

message DeployCommand {
  string deployment_id = 1;
  string service_name = 2;
  string store_path = 3;
  DeployStrategy strategy = 4;
}

enum DeployStrategy {
  ROLLING = 0;
  CANARY = 1;
  BLUE_GREEN = 2;
}

message SecretUpdate {
  string service_name = 1;
  string secret_name = 2;
  bytes encrypted_value = 3;
  uint64 version = 4;
}

message DnsUpdate {
  repeated DnsRecord records = 1;
}

message DnsRecord {
  string name = 1;
  DnsRecordType record_type = 2;
  repeated string values = 3;
  uint32 ttl = 4;
}

enum DnsRecordType {
  A = 0;
  AAAA = 1;
  SRV = 2;
  CNAME = 3;
}

message CertificateResponse {
  bytes certificate = 1;
  bytes chain = 2;
  uint64 expires_at = 3;
  string service_name = 4;  // Which service/identity this certificate is for.
}

message PeerUpdate {
  repeated WireguardPeer peers = 1;
}

message WireguardPeer {
  string node_id = 1;
  string public_key = 2;
  string endpoint = 3;
  string allowed_ip = 4;
}

message PolicyUpdate {
  repeated NetworkPolicy policies = 1;
}

message NetworkPolicy {
  string source_service = 1;
  string target_service = 2;
  repeated uint32 allowed_ports = 3;
}

// --- Node Attestation ---

// Request from agent to initiate SPIFFE-style node attestation.
// Sent via the Attest RPC (unauthenticated — no bearer token required).
message NodeAttestationRequest {
  string attestation_type = 1;  // "join_token", "nix_store_path", "tpm"
  bytes attestation_data = 2;   // Type-specific payload (e.g., the join token)
  bytes csr = 3;                // PKCS#10 CSR for the node SVID
}

// Server-initiated challenge (e.g., TPM nonce) sent during attestation.
message NodeAttestationChallenge {
  bytes challenge_data = 1;
}

// Agent response to a server attestation challenge.
message NodeAttestationResponse {
  bytes response_data = 1;
}

// Result of node attestation, returned by the Attest RPC.
message NodeAttestationResult {
  bool success = 1;
  string node_spiffe_id = 2;    // e.g., spiffe://fleet.internal/agent/<node-id>
  bytes node_certificate = 3;   // Node SVID certificate PEM
  bytes trust_bundle = 4;       // CA trust bundle PEM
  string error_message = 5;
  string trust_domain = 6;      // Trust domain for SPIFFE IDs
}

// Fleet encryption key distributed to agents over mTLS channel.
message FleetKeyUpdate {
  bytes encrypted_key = 1;      // Fleet encryption key (encrypted or plaintext over mTLS)
  uint64 version = 2;           // Key version for rotation
}

// --- Plan / Apply / Status RPCs ---

message PlanRequest {
  string config_path = 1;
}

message PlanResponse {
  repeated PlannedOperation operations = 1;
  bool has_changes = 2;
}

message PlannedOperation {
  OperationType operation_type = 1;
  string service_name = 2;
  string target_node = 3;
  string description = 4;
}

enum OperationType {
  CREATE = 0;
  UPDATE = 1;
  DESTROY = 2;
  RESCHEDULE = 3;
}

message ApplyRequest {
  string config_path = 1;
  bool auto_approve = 2;
  // If true, continue watching for changes and run scaling actuator.
  bool watch = 3;
}

message ApplyEvent {
  string operation_id = 1;
  ApplyStatus status = 2;
  string message = 3;
}

enum ApplyStatus {
  APPLY_PENDING = 0;
  APPLY_IN_PROGRESS = 1;
  APPLY_SUCCEEDED = 2;
  APPLY_FAILED = 3;
  APPLY_ROLLED_BACK = 4;
}

message StatusRequest {
  // Empty for now; can add filters later.
}

message FleetStatus {
  string fleet_name = 1;
  repeated NodeStatus nodes = 2;
  repeated ServiceStatus services = 3;
  repeated PoolStatus pools = 4;
}

message NodeStatus {
  string node_id = 1;
  string address = 2;
  bool healthy = 3;
  NodeResources total_resources = 4;
  NodeResources available_resources = 5;
  uint64 last_heartbeat = 6;
  string pool = 7;
}

message PoolStatus {
  string name = 1;
  uint32 machine_count = 2;
  NodeResources total_schedulable = 3;
  NodeResources total_allocated = 4;
  map<string, string> labels = 5;
}

message ServiceStatus {
  string name = 1;
  uint32 desired_count = 2;
  uint32 healthy_count = 3;
  repeated InstanceStatus instances = 4;
}

message InstanceStatus {
  string instance_id = 1;
  string node_id = 2;
  ServiceState state = 3;
  HealthStatus health = 4;
}

// --- Rollback ---

message RollbackRequest {
  string machine = 1;     // empty = all (when `all` is true)
  bool all = 2;
  uint64 to_generation = 3; // 0 = previous generation
}

message RollbackResponse {
  bool success = 1;
  string message = 2;
}

// --- Drain ---

message DrainRequest {
  string machine = 1;
  uint64 deadline_seconds = 2; // 0 = no deadline
}

message DrainResponse {
  bool success = 1;
  repeated string rescheduled_services = 2;
}

// --- Scale ---

message ScaleRequest {
  string service_name = 1;
  uint32 desired_count = 2;
}

message ScaleResponse {
  bool success = 1;
  uint32 previous_count = 2;
  uint32 new_count = 3;
}

// --- Snapshot / Restore ---

message SnapshotRequest {}

message SnapshotResponse {
  bytes data = 1;
  uint64 last_index = 2;
}

message RestoreRequest {
  bytes data = 1;
}

message RestoreResponse {
  bool success = 1;
  string message = 2;
}

// --- Dispatch ---

message DispatchRequest {
  string service_name = 1;
  map<string, string> params = 2;
}

message DispatchResponse {
  string instance_id = 1;
  bool success = 2;
  string message = 3;
}

// --- Exec ---

message ExecRequest {
  string service_name = 1;
  repeated string command = 2;
  uint32 timeout_seconds = 3;
  string node_id = 4;
}

message ExecResponse {
  int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
}

// --- Logs ---

message LogsRequest {
  string service_name = 1;
  uint32 lines = 2;
  bool follow = 3;
  string node_id = 4;
}

message LogsChunk {
  string node_id = 1;
  bytes data = 2;
}

// --- Events ---

message EventsRequest {
  string category = 1;
  string service = 2;
  string node = 3;
  uint32 limit = 4;
}

message EventsResponse {
  repeated FleetEventProto events = 1;
}

message FleetEventProto {
  uint64 timestamp = 1;
  string level = 2;
  string category = 3;
  string service = 4;
  string node = 5;
  string message = 6;
}

// --- Node Management ---

message ListNodesRequest {}

message ListNodesResponse {
  repeated NodeDetail nodes = 1;
}

message GetNodeRequest {
  string node_id = 1;
}

message NodeDetail {
  string node_id = 1;
  string address = 2;
  string pool = 3;
  bool healthy = 4;
  bool schedulable = 5;
  NodeResources total_resources = 6;
  NodeResources available_resources = 7;
  uint64 last_heartbeat = 8;
  repeated ServiceInstance running_services = 9;
}

message UpdateNodeRequest {
  string node_id = 1;
  bool schedulable = 2;
}

message UpdateNodeResponse {
  bool success = 1;
}

// --- Top (resource usage) ---

message TopRequest {
  string mode = 1;
}

message TopResponse {
  repeated NodeResourceUsage nodes = 1;
  repeated ServiceResourceUsage services = 2;
}

message NodeResourceUsage {
  string node_id = 1;
  string pool = 2;
  uint64 cpu_used = 3;
  uint64 cpu_total = 4;
  uint64 memory_used = 5;
  uint64 memory_total = 6;
  uint32 service_count = 7;
}

message ServiceResourceUsage {
  string service_name = 1;
  uint32 instance_count = 2;
  uint64 cpu_request = 3;
  uint64 memory_request = 4;
}

// --- Deployment Management ---

message ListDeploymentsRequest {
  string service = 1;
  uint32 limit = 2;
}

message ListDeploymentsResponse {
  repeated DeploymentRecord deployments = 1;
}

message DeploymentRecord {
  string deployment_id = 1;
  string service_name = 2;
  uint64 started_at = 3;
  uint64 completed_at = 4;
  string status = 5;
  string strategy = 6;
  uint32 instance_count = 7;
  string store_path = 8;
}

message PromoteRequest {
  string service_name = 1;
}

message PromoteResponse {
  bool success = 1;
  string message = 2;
}

message FailDeploymentRequest {
  string service_name = 1;
}

message FailDeploymentResponse {
  bool success = 1;
  string message = 2;
}

// --- ACL Token Management ---

message CreateACLTokenRequest {
  string role = 1;
  string description = 2;
}

message CreateACLTokenResponse {
  string token = 1;
  string role = 2;
}

message RevokeACLTokenRequest {
  string token = 1;
}

message RevokeACLTokenResponse {
  bool success = 1;
}

message ListACLTokensRequest {}

message ListACLTokensResponse {
  repeated ACLTokenInfo tokens = 1;
}

message ACLTokenInfo {
  string description = 1;
  string role = 2;
}
